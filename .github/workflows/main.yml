name: Simple Windows RDP (Bore Tunnel)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Create User & Enable RDP
        shell: pwsh
        run: |
          $Pass = ConvertTo-SecureString "KingRDP2025!" -AsPlainText -Force

          if (-not (Get-LocalUser -Name "IPxKINGYT" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "IPxKINGYT" -Password $Pass -PasswordNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member "IPxKINGYT"
            Write-Output "User created"
          } else {
            Write-Output "User already exists"
          }

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Download & Start Bore Tunnel
        shell: pwsh
        run: |
          Write-Output ""
          Write-Output "======================================"
          Write-Output "   ★ WINDOWS RDP READY ★"
          Write-Output "   USERNAME : IPxKINGYT"
          Write-Output "   PASSWORD : KingRDP2025!"
          Write-Output "======================================"
          Write-Output ""
          
          # Download bore CLI (Rust binary for Windows)
          $BoreUrl = "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $BoreUrl -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force
          
          $BoreExe = "$PWD\bore.exe"
          if (-not (Test-Path $BoreExe)) {
            Write-Error "bore.exe not found!"
            exit 1
          }

          Write-Output "Bore tunnel starting on port 3389..."
          & $BoreExe local 3389 --to bore.pub
